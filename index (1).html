<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speed No Limits</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game">
    <h1>Speed No Limits</h1>
    <div class="hud">
      <span>Score: <strong id="score">0</strong></span>
      <span>Speed: <strong id="speed">1</strong>x</span>
    </div>

    <div id="road" class="road" aria-label="Car racing game">
      <div id="player" class="car player-car"></div>
    </div>

    <p id="message">Use ← → or A D to drive</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
